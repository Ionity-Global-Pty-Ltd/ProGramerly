# ProGramerly - build Windows, macOS and Linux installers on native runners
# Antwerp Designs | Ionity (Pty) Ltd | AEDI - Policy 986 AED
name: Build installers

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: >-
          Publish the built installers onto this existing release tag
          (e.g. v2.2.0). Leave blank to only upload build artifacts.
        required: false
        default: ''

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/syntax-check.js
      - run: node scripts/validate-catalog.js
      - run: node scripts/check-programs.js
      - run: node scripts/dry-run.js full win
      - run: node scripts/dry-run.js full mac
      - run: node scripts/dry-run.js ai win
      - run: node scripts/dry-run.js minimal mac
      - name: PowerShell syntax check
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($f in Get-ChildItem scripts -Filter *.ps1) {
            # Both must exist before [ref] takes them - pwsh on Linux refuses
            # to make a reference to a variable that was never assigned.
            $tokens = $null
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $f.FullName, [ref]$tokens, [ref]$errs)
            if ($errs) { $errs; throw "syntax errors in $($f.Name)" }
          }
      - name: Bash syntax check
        run: for f in scripts/*.sh; do bash -n "$f"; done

  # The app must actually boot. This caught a real one: the intro window
  # closing before the main window existed made Electron fire
  # window-all-closed and quit the app on launch.
  smoke:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci || npm install
      - name: Install a display
        run: sudo apt-get update && sudo apt-get install -y xvfb imagemagick libnss3 libatk-bridge2.0-0 libgtk-3-0 libasound2t64
      - name: Boot the app and prove it stays up
        env:
          PROGRAMERLY_UI_FIXTURES: '1'
        run: |
          Xvfb :99 -screen 0 1400x950x24 &
          sleep 2
          DISPLAY=:99 ./node_modules/electron/dist/electron . --no-sandbox --disable-gpu > app.log 2>&1 &
          sleep 25
          pgrep -f 'electron/dist/electron' > /dev/null || { echo '::error::the app exited during launch'; tail -50 app.log; exit 1; }
          DISPLAY=:99 import -window root screenshot.png
          echo "app is alive after 25s"
      - name: Drive the real application (no fixtures)
        run: |
          pkill -f 'electron/dist/electron' || true
          xvfb-run -a -s "-screen 0 1600x1000x24" node scripts/ui-check-350.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshot
          path: |
            screenshot.png
            app.log
            Claude outputs/ui-350-*.png
            Claude outputs/ui-check-350.json
          if-no-files-found: warn

  windows:
    needs: [validate, smoke]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci || npm install
      # The Ionity tools (~495 MB, three files over GitHub's 100 MB per-file
      # limit) are integrated capabilities of ProGramerly, not separate
      # products, so they are never published for download. They live as
      # assets on the `programs-v1` release of the PRIVATE repository
      # Ionity-Global-Pty-Ltd/programerly-payload and are pulled here with a
      # read-only token (repository secret PAYLOAD_TOKEN) so electron-builder's
      # win.extraResources packs them into resources/programs. Every file is
      # then checked against the size + SHA-256 pins in
      # src/main/data/programs.json - a corrupted or tampered payload fails the
      # build rather than shipping. Without the token the installer is still
      # built and the Command Center reports those tools as "not in this build".
      - name: Fetch integrated tools payload (private programs-v1)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.PAYLOAD_TOKEN }}
          PAYLOAD_REPO: Ionity-Global-Pty-Ltd/programerly-payload
        run: |
          $ErrorActionPreference = 'Continue'
          $folder = 'PROGRAMS TO REF AND USE'
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          if (-not $env:GH_TOKEN) {
            Write-Host "::warning::PAYLOAD_TOKEN secret is not set - building without the integrated Ionity tools (add a read-only token for $env:PAYLOAD_REPO to include them)"
            exit 0
          }
          gh release download programs-v1 --repo $env:PAYLOAD_REPO --dir $folder --clobber 2>&1 | Write-Host
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::programs-v1 payload could not be fetched from $env:PAYLOAD_REPO - building without the integrated Ionity tools"
            Get-ChildItem $folder -File | Remove-Item -Force
            exit 0
          }
          Get-ChildItem $folder | Format-Table Name, Length -AutoSize | Out-String | Write-Host
          $ErrorActionPreference = 'Stop'
          node scripts/check-programs.js --strict
          if ($LASTEXITCODE -ne 0) { throw 'payload verification failed' }
      # Code signing is what makes the SmartScreen "Windows protected your PC"
      # dialog go away. electron-builder 25 signs through Azure Trusted Signing
      # when these six secrets exist; with none of them the build is unsigned
      # and SmartScreen shows the dialog until the publisher earns reputation.
      #   AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET   (service principal)
      #   AZURE_SIGNING_ENDPOINT      e.g. https://weu.codesigning.azure.net
      #   AZURE_SIGNING_ACCOUNT       the Trusted Signing account name
      #   AZURE_SIGNING_PROFILE       the certificate profile name
      # A classic Authenticode .pfx works too: CSC_LINK (base64) + CSC_KEY_PASSWORD.
      - name: Build Windows installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          $ebArgs = @('--win', '--publish', 'never')
          if ($env:AZURE_TENANT_ID -and $env:AZURE_CLIENT_ID -and $env:AZURE_CLIENT_SECRET -and $env:AZURE_SIGNING_ENDPOINT -and $env:AZURE_SIGNING_ACCOUNT -and $env:AZURE_SIGNING_PROFILE) {
            Write-Host "signing with Azure Trusted Signing ($env:AZURE_SIGNING_ACCOUNT / $env:AZURE_SIGNING_PROFILE)"
            $ebArgs += @(
              "--config.win.azureSignOptions.endpoint=$env:AZURE_SIGNING_ENDPOINT",
              "--config.win.azureSignOptions.codeSigningAccountName=$env:AZURE_SIGNING_ACCOUNT",
              "--config.win.azureSignOptions.certificateProfileName=$env:AZURE_SIGNING_PROFILE",
              "--config.win.azureSignOptions.publisherName=Ionity (Pty) Ltd"
            )
          } elseif ($env:WIN_CSC_LINK) {
            Write-Host "signing with the Authenticode certificate from repository secrets"
            $env:CSC_LINK = $env:WIN_CSC_LINK
            $env:CSC_KEY_PASSWORD = $env:WIN_CSC_KEY_PASSWORD
          } else {
            Write-Host "::notice::no Windows signing secrets - building unsigned (SmartScreen will warn until the app is signed)"
          }
          npx electron-builder @ebArgs
          if ($LASTEXITCODE -ne 0) { throw "electron-builder exited $LASTEXITCODE" }
      - name: Report what the installer bundles
        shell: pwsh
        run: |
          $bundled = Get-ChildItem 'dist/win-unpacked/resources/programs' -File -ErrorAction SilentlyContinue
          if ($bundled) { Write-Host "integrated Ionity tools in this build:"; $bundled | Format-Table Name, Length -AutoSize | Out-String | Write-Host }
          else { Write-Host "::notice::no integrated tools in this build (PAYLOAD_TOKEN absent or payload unavailable)" }
          $signed = Get-ChildItem dist -Filter *.exe -File | ForEach-Object { $sig = Get-AuthenticodeSignature $_.FullName; "{0,-45} {1}" -f $_.Name, $sig.Status }
          Write-Host "Authenticode status:"; $signed | Write-Host
          Get-ChildItem dist -File | Format-Table Name, Length -AutoSize | Out-String | Write-Host
      - uses: actions/upload-artifact@v4
        with:
          name: ProGramerly-windows
          path: |
            dist/*.exe
            dist/*.blockmap
          if-no-files-found: error

  macos:
    needs: [validate, smoke]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci || npm install
      - name: Build macOS installer
        # A missing secret still defines the variable, as an empty string, and
        # electron-builder resolves an empty CSC_LINK against the project root
        # and dies with "<projectDir> not a file". So the signing variables are
        # exported here only when they actually carry something; otherwise the
        # build is explicitly told not to go looking for an identity and
        # produces a working unsigned .dmg - Gatekeeper then asks the user to
        # right-click > Open the first time.
        shell: bash
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          MAC_APPLE_ID: ${{ secrets.APPLE_ID }}
          MAC_APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          MAC_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$MAC_CERT_P12_BASE64" ]; then
            export CSC_LINK="$MAC_CERT_P12_BASE64"
            export CSC_KEY_PASSWORD="$MAC_CERT_PASSWORD"
            echo "signing with the certificate from repository secrets"
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            echo "::notice::no signing certificate in secrets - building an unsigned .dmg"
          fi
          if [ -n "$MAC_APPLE_ID" ] && [ -n "$MAC_APPLE_APP_PASSWORD" ] && [ -n "$MAC_APPLE_TEAM_ID" ]; then
            export APPLE_ID="$MAC_APPLE_ID"
            export APPLE_APP_SPECIFIC_PASSWORD="$MAC_APPLE_APP_PASSWORD"
            export APPLE_TEAM_ID="$MAC_APPLE_TEAM_ID"
            echo "notarising as $APPLE_ID"
          else
            echo "::notice::Apple ID secrets absent - skipping notarisation"
          fi
          # electron-builder writes every artifact, then unmounts the DMG volume.
          # On the Apple-Silicon runners that final `hdiutil detach` intermittently
          # returns 1 - or 3, "no such volume", because it was already unmounted -
          # which fails the step even though the .dmg and .zip files are complete
          # and valid. So the exit code is captured and then judged against what
          # actually landed in dist/. A real build failure produces no artifacts
          # and still fails here.
          set +e
          npx electron-builder --mac --publish never
          rc=$?
          set -e
          dmgs=$(ls -1 dist/*.dmg 2>/dev/null | wc -l | tr -d " ")
          zips=$(ls -1 dist/*.zip 2>/dev/null | wc -l | tr -d " ")
          echo "electron-builder exit=$rc  dmg=$dmgs  zip=$zips"
          ls -la dist/ || true
          if [ "$dmgs" -ge 1 ] && [ "$zips" -ge 1 ]; then
            if [ "$rc" -ne 0 ]; then
              echo "::warning::electron-builder exited $rc after writing every artifact (hdiutil detach flake on the arm64 runner) - artifacts verified present, treating as success"
            fi
            exit 0
          fi
          echo "::error::macOS build produced no usable artifacts (electron-builder exit $rc)"
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: ProGramerly-macos
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  linux:
    needs: [validate, smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci || npm install
      # electron-builder shells out to rpmbuild for the .rpm target and to
      # dpkg/fakeroot for the .deb; neither ships on the runner image.
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y rpm fakeroot dpkg
      - name: Build Linux installers
        run: npx electron-builder --linux --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: ProGramerly-linux
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      # Only the three platform artifacts. Without the pattern this also pulls
      # down smoke-screenshot (app.log + screenshot.png) and ships those as
      # release downloads, which is how they ended up attached to v2.2.1.
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: ProGramerly-*
      # The in-app updater verifies its download against this file, so a
      # release without it downgrades to "trust the transport".
      - name: Publish checksums
        run: |
          cd artifacts
          find . -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' \
            -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) \
            -exec sha256sum {} + | sed 's#\./[^ ]*/#*#' > SHA256.txt
          cat SHA256.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          # artifacts/**/* already matches artifacts/SHA256.txt. Listing it a
          # second time made the action upload the same name twice; the second
          # copy deletes-then-reuploads and lost the race ("Not Found ...
          # update-a-release-asset"), which failed the step, left v2.3.0 as a
          # draft and dropped SHA256.txt from the release.
          files: artifacts/**/*
          # Explicit, so a re-run also publishes a release the failed first
          # attempt left behind as a draft.
          draft: false
          generate_release_notes: true
          body: |
            **ProGramerly - Basic Coding Software for All**

            Free desktop installer for a complete development environment.

            | Platform | Download |
            | --- | --- |
            | Windows 10/11 | `ProGramerly-Setup-*.exe` |
            | Windows (no install) | `ProGramerly-Portable-*.exe` |
            | macOS Apple Silicon | `ProGramerly-*-arm64.dmg` |
            | macOS Intel | `ProGramerly-*-x64.dmg` |
            | Linux (any distro) | `ProGramerly-*.AppImage` |
            | Debian / Ubuntu | `programerly_*_amd64.deb` |
            | Fedora / RHEL / openSUSE | `programerly-*.x86_64.rpm` |

            **What is inside.** ProGramerly is the combined Ionity workstation: the Ai-OS
            operator layout, live telemetry, the Ionity DOME - this machine as five strata and
            25 segments, each bound to a registered data set - fan control and CiC built in on
            Windows and verified against their SHA-256 pins before they run, and local AI
            through Ollama with a small default model (`llama3.2:1b`) that works on CPU.

            **The local core is on the deck.** On launch the model reads the registered sets
            and reports, naming the model, the sets it could read and the tokens per second.
            Every workspace carries its own Ask control scoped to what it covers; the dock orb
            holds all eleven analysis presets; Ctrl+/ runs the brief from anywhere; Settings
            carries the whole of it - brief, model, re-read cadence, accent, DOME report.
            Nothing it reads leaves the machine.

            **Reading.** A workspace that turns a page, a screenshot or a PDF into text on this
            machine. An OCR engine (Tesseract, RapidOCR, EasyOCR) returns the characters it
            found; a tiny vision model (moondream, granite3.2-vision) reads layout and
            handwriting and can be asked a question about the page instead of transcribing it.
            The answer always names which reader produced it. Nothing is uploaded to be read.

            **Gemma**, first class: `gemma3:1b` for triage, `gemma4:e2b` for everyday work,
            `gemma4:e4b` where the memory is there - and every curated model declares what it
            is for: chat, code, reasoning, vision or embeddings.

            Windows builds are unsigned until a code-signing certificate is added to the
            repository secrets, so SmartScreen shows "Windows protected your PC" - choose
            *More info > Run anyway*. The SHA256.txt above lets you verify the file first.

            Download page: https://www.ionity.fun

            ---
