<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; media-src 'self' data:" />
  <title>IONITY</title>
  <link rel="stylesheet" href="intro.css" />
</head>
<body>
  <div class="stage" id="stage">
    <canvas id="stars"></canvas>
    <!-- The Ionity node burst - the brand's own intro film, cut before it turns
         white and cropped square so the generator mark falls outside. -->
    <video class="burst" id="burst" src="assets/media/ionity-intro.mp4" muted playsinline preload="auto"></video>

    <div class="beamlane" id="beamlane">
      <div class="beam" id="beam">
        <span class="b0">·····</span><span class="b1">----</span><span class="b2">≡≡</span><span class="tip">►</span>
      </div>
    </div>

    <div class="logo" id="logo" role="img" aria-label="IONITY GLOBAL">
      <img src="assets/ionity-mark.png" alt="IONITY GLOBAL" draggable="false" />
      <span class="sweep" aria-hidden="true"></span>
    </div>
    <div class="subtitle" id="subtitle"></div>
    <div class="strap" id="strap">AEDi · Native-AI workstation · ProGramerly</div>

    <!-- The DOME assembles in 3D: one band per stratum, base first, each drawn
         as its facts are read off this machine. -->
    <section class="domewrap" id="domewrap" aria-hidden="true">
      <div class="dome3d-host"><canvas class="dome3d" id="dome3d"></canvas></div>
      <ul class="strata" id="strata"></ul>
    </section>

    <div class="status" id="status"></div>

    <div class="colophon" id="colophon">
      <span>ProGramerly</span>
      <em>Basic Coding Software for All · Anything is Possible with God.</em>
      <span class="dim" id="colo-meta">Policy 986 AED · © 2018–2026 Antwerp Designs | Ionity (Pty) Ltd · TM</span>
    </div>

    <img class="corner-mark" id="watermark" src="assets/ionity-official.png" alt="IONITY" draggable="false" />
    <button class="skip" id="skip" type="button">Skip</button>
  </div>
  <div class="flash" id="flash" aria-hidden="true"></div>
  <script src="dome3d.js"></script>
  <script src="intro.js"></script>
</body>
</html>
