<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; media-src 'self' data:" />
  <title>IONITY</title>
  <link rel="stylesheet" href="intro.css" />
</head>
<body>
  <div class="stage" id="stage">
    <canvas id="stars"></canvas>

    <div class="beamlane" id="beamlane">
      <div class="beam" id="beam">
        <span class="b0">·····</span><span class="b1">----</span><span class="b2">≡≡</span><span class="tip">►</span>
      </div>
    </div>

    <div class="logo" id="logo" aria-label="IONITY" role="img"></div>
    <div class="subtitle" id="subtitle"></div>

    <!-- The DOME assembles: one arc per stratum, drawn as its facts are read. -->
    <section class="domewrap" id="domewrap" aria-hidden="true">
      <svg class="dome" id="dome" viewBox="0 0 520 250" preserveAspectRatio="xMidYMax meet">
        <g id="arcs"></g>
        <g id="segdots"></g>
        <line class="ground" x1="24" y1="232" x2="496" y2="232" />
        <circle class="apex" id="apex" cx="260" cy="156" r="0" />
      </svg>
      <ul class="strata" id="strata"></ul>
    </section>

    <div class="status" id="status"></div>

    <div class="colophon" id="colophon">
      <span>ProGramerly</span>
      <em>Basic Coding Software for All</em>
      <span class="dim" id="colo-meta">Policy 986 AED · © 2018–2026 Antwerp Designs | Ionity (Pty) Ltd</span>
    </div>

    <img class="watermark" id="watermark" src="assets/ionity-mark.png" alt="" aria-hidden="true" />
    <button class="skip" id="skip" type="button">Skip</button>
  </div>
  <div class="flash" id="flash" aria-hidden="true"></div>
  <script src="intro.js"></script>
</body>
</html>
